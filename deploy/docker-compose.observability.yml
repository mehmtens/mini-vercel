# ==============================================================================
# Mini-Vercel Observability Stack (Prometheus, Grafana & Node Exporter)
# Usage: docker compose -f deploy/docker-compose.production.yml -f deploy/docker-compose.observability.yml up -d
# ==============================================================================
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mini_vercel_prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - mini_vercel_network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mini_vercel_node_exporter
    restart: always
    command:
      - "--collector.textfile.directory=/etc/node-exporter/textfile_collector"
      - "--no-collector.hwmon"
      - "--no-collector.arp"
    volumes:
      - node_exporter_textfile:/etc/node-exporter/textfile_collector:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - mini_vercel_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mini_vercel_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required for production deployment}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - mini_vercel_network

volumes:
  prometheus_data:
    name: mini_vercel_prometheus_data
  grafana_data:
    name: mini_vercel_grafana_data
  node_exporter_textfile:
    name: mini_vercel_node_exporter_textfile
