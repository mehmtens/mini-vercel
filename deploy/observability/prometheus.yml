# ==============================================================================
# Mini-Vercel Prometheus Configuration
# ==============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # 1. Mini-Vercel Fastify REST API Scraper
  - job_name: "mini-vercel-api"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8080"]

  # 2. Mini-Vercel BullMQ Worker Scraper (Internal Container Network)
  - job_name: "mini-vercel-worker"
    scrape_interval: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:9090"]

  # 3. Node Exporter & Textfile Collector (Host & Backup Status Metrics)
  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
