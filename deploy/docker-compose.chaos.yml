# ==============================================================================
# Doplo Chaos & Fault-Injection Compose Profile
# Usage: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.chaos.yml up -d
# ==============================================================================
services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: doplo_toxiproxy
    ports:
      - "8474:8474" # Toxiproxy API
      - "26379:26379" # Proxied Redis with injected latency/outage
      - "29000:29000" # Proxied MinIO with injected latency/outage
    networks:
      - doplo_network

  chaos-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: doplo_chaos_worker
    environment:
      NODE_ENV: test
      REDIS_URL: redis://toxiproxy:26379
      MINIO_ENDPOINT: toxiproxy
      MINIO_PORT: 29000
      BUILD_TIMEOUT_SECONDS: 2
      QUEUE_CONCURRENCY: 2
    networks:
      - doplo_network
