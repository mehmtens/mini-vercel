# DEPRECATED: Do not use this legacy file for new deployments.
# Use deploy/docker-compose.production.yml and the production runbook instead.
name: doplo

services:
  postgres:
    image: postgres:16-alpine
    container_name: doplo_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-doplo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doplo_network

  redis:
    image: redis:7-alpine
    container_name: doplo_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doplo_network

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: doplo_minio_prod
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doplo_network

  minio-init:
    image: minio/mc:latest
    container_name: doplo_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/${MINIO_BUCKET_BUILDS:-doplo-builds};
      exit 0;
      "
    networks:
      - doplo_network

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: doplo_api_prod
    restart: always
    environment:
      NODE_ENV: production
      API_PORT: 8080
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doplo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BUILDS: ${MINIO_BUCKET_BUILDS:-doplo-builds}
      QUEUE_NAME: ${QUEUE_NAME:-deployment-queue}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:?CRYPTO_MASTER_KEY is required}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET is required}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - doplo_network

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: doplo_worker_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doplo}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_BUILDS: ${MINIO_BUCKET_BUILDS:-doplo-builds}
      QUEUE_NAME: ${QUEUE_NAME:-deployment-queue}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      CRYPTO_MASTER_KEY: ${CRYPTO_MASTER_KEY:?CRYPTO_MASTER_KEY is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required; run stat -c '%g' /var/run/docker.sock}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - doplo_network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: doplo_web_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
    depends_on:
      - api
    networks:
      - doplo_network

  caddy:
    image: caddy:2-alpine
    container_name: doplo_caddy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - doplo_network

volumes:
  postgres_data:
    name: doplo_postgres_prod_data
  redis_data:
    name: doplo_redis_prod_data
  minio_data:
    name: doplo_minio_prod_data
  caddy_data:
    name: doplo_caddy_prod_data
  caddy_config:
    name: doplo_caddy_prod_config

networks:
  doplo_network:
    name: doplo_prod_network
    driver: bridge
