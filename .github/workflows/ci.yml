name: CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doplo
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5435/doplo
      REDIS_URL: redis://127.0.0.1:6379
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_BUILDS: doplo-builds
      CRYPTO_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GITHUB_WEBHOOK_SECRET: dev_webhook_secret_key_12345
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm 11 and Node.js 22
        uses: pnpm/setup@v1
        with:
          version: 11.22.0
          runtime: node@22
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Dashboard E2E Tests
        run: pnpm --filter @doplo/web exec playwright install --with-deps chromium

      - name: Dependency Security Audit
        run: pnpm audit --prod

      - name: Validate Production Compose and Caddy Configuration
        env:
          BASE_DOMAIN: ci.example.com
          APP_DOMAIN: app.ci.example.com
          ACME_EMAIL: ci@example.com
          DOCKER_GID: '999'
          POSTGRES_USER: doplo_ci
          POSTGRES_PASSWORD: ci-database-password-with-32-characters
          POSTGRES_DB: doplo_ci
          REDIS_PASSWORD: ci-redis-password-with-32-characters
          MINIO_ROOT_USER: doplo_ci
          MINIO_ROOT_PASSWORD: ci-minio-password-with-32-characters
          MINIO_BUCKET_BUILDS: doplo-ci-builds
          SESSION_SECRET: ci-session-secret-with-at-least-32-characters
          GITHUB_CLIENT_ID: ci_github_client_id
          GITHUB_CLIENT_SECRET: ci-github-client-secret-with-32-characters
          GITHUB_CALLBACK_URL: https://app.ci.example.com/api/auth/callback/github
          GITHUB_WEBHOOK_SECRET: ci-webhook-secret-with-at-least-32-characters
          CLOUDFLARE_TUNNEL_TOKEN: ci-validation-token
        run: |
          CRYPTO_MASTER_KEY="$(printf '01%.0s' {1..32})"
          export CRYPTO_MASTER_KEY
          docker compose -f deploy/docker-compose.production.yml config --quiet
          docker compose -f docker-compose.yml -f deploy/docker-compose.tunnel.yml config --quiet
          docker run --rm \
            -e APP_DOMAIN -e BASE_DOMAIN -e ACME_EMAIL \
            -v "$PWD/deploy/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          if node scripts/production-preflight.mjs deploy/production.env.example; then
            echo "Unsafe production template unexpectedly passed preflight"
            exit 1
          fi
          pnpm test:production-preflight

      - name: Start MinIO Server (Pinned Release)
        run: |
          docker run -d --name minio-server \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2024-01-18T22-51-28Z server /data --console-address ":9001"

      - name: Wait for MinIO Server Readiness (Bounded Retry Probe)
        run: |
          # JavaScript template literals must remain shell-literal.
          # shellcheck disable=SC2016
          node -e '
            async function waitForMinio() {
              const maxAttempts = 30;
              for (let i = 1; i <= maxAttempts; i++) {
                try {
                  const res = await fetch("http://127.0.0.1:9000/minio/health/live");
                  if (res.ok) {
                    console.log(`MinIO server is ready on attempt ${i}`);
                    process.exit(0);
                  }
                } catch {
                  // retry
                }
                await new Promise(r => setTimeout(r, 1000));
              }
              console.error("MinIO failed to become ready within 30 seconds");
              process.exit(1);
            }
            waitForMinio();
          '

      - name: Generate Prisma Client & Sync Schema
        run: pnpm --filter @doplo/database prisma:generate

      - name: Bootstrap MinIO Builds Bucket & Verify Presence
        run: |
          # JavaScript template literals must remain shell-literal.
          # shellcheck disable=SC2016
          pnpm --filter @doplo/api exec node -e '
            const Minio = require("minio");
            const client = new Minio.Client({
              endPoint: "127.0.0.1",
              port: 9000,
              useSSL: false,
              accessKey: "minioadmin",
              secretKey: "minioadmin"
            });
            async function bootstrap() {
              const bucketName = "doplo-builds";
              const exists = await client.bucketExists(bucketName);
              if (!exists) {
                await client.makeBucket(bucketName, "us-east-1");
              }
              const verified = await client.bucketExists(bucketName);
              if (!verified) {
                console.error(`Bucket "${bucketName}" verification failed after creation`);
                process.exit(1);
              }
              console.log(`Bucket "${bucketName}" successfully verified and active`);
            }
            bootstrap().catch(err => {
              console.error("MinIO bucket bootstrap failed:", err);
              process.exit(1);
            });
          '

      - name: Run Linting
        run: pnpm lint

      - name: Run TypeScript Typechecking
        run: pnpm typecheck

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build All Monorepo Packages & Apps
        run: pnpm build

      - name: Run Dashboard Browser E2E Tests
        run: pnpm --filter @doplo/web test:e2e

      - name: Upload Browser Test Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doplo-playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate and Upload Complete Software Bill of Materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: doplo-sbom.cdx.json
          upload-release-assets: false
